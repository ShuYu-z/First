<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Journal</title>

<link rel="stylesheet" href="write.css">

</head>

<body class="write-page">

<div class="page">

<div class="top-bar">

<a href="index.html" class="back">← Back</a>

<div id="date"></div>

</div>

<h1>✨ My Journal</h1>

<p class="subtitle">

今天想记录些什么？

</p>

<input
type="text"
placeholder="今天的标题……"
class="title-input">

<textarea
placeholder="今天发生了什么？

今天有什么值得开心的事情？

或者只是想安静写一点东西……"
class="content-input"></textarea>

<button class="save-btn">

Save

</button>

</div>

<script>

const today = new Date();

const options = {
year:'numeric',
month:'2-digit',
day:'2-digit'
};

document.getElementById("date").innerHTML=
today.toLocaleDateString('zh-CN',options);

</script>

</body>

</html>
