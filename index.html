<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <div class="container">

        <h1 class="title">My World</h1>

        <p class="subtitle">
            欢迎来到我的 AI 工作台
        </p>

  <button class="enter-btn" onclick="goToWrite()">
    Enter →
</button>

<script>
function goToWrite() {

    // 按钮点击反馈
    document.querySelector(".enter-btn").style.transform = "scale(0.95)";

    // 页面淡出
    document.body.style.opacity = "0";

    // 0.6秒后跳转
    setTimeout(() => {
        window.location.href = "write.html";
    }, 600);
}
</script>
    </div>

</body>

</html>
